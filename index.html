<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal OS: Minimalist Edition</title>
    <style>
        /* Clean, Human, Monochrome Design */
        body {
            background-color: #0f0f0f;
            color: #d4d4d4;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* Sidebar Styling */
        #sidebar {
            width: 260px;
            background: #141414;
            border-right: 1px solid #262626;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .brand {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .level-tracker {
            background: #1e1e1e;
            color: #ffffff;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            border: 1px solid #333333;
            margin-bottom: 5px;
        }

        .action-btn {
            background: transparent;
            color: #a3a3a3;
            border: 1px solid #333333;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            margin-bottom: 15px;
            transition: 0.2s;
        }

        .action-btn:hover {
            background: #262626;
            color: #ffffff;
        }

        .menu-btn {
            background: transparent;
            color: #888888;
            border: none;
            text-align: left;
            padding: 10px 15px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .menu-btn:hover,
        .menu-btn.active {
            background: #262626;
            color: #ffffff;
        }

        /* Main Area */
        #main-content {
            flex: 1;
            padding: 40px;
            position: relative;
        }

        .page {
            display: none;
            height: 100%;
            animation: fadeIn 0.3s ease forwards;
        }

        .page.active {
            display: flex;
            flex-direction: column;
        }

        /* Terminal Window */
        #terminal-window {
            flex: 1;
            background-color: #000000;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 25px;
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .output-log {
            color: #cccccc;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .system-text {
            color: #777777;
            font-style: italic;
        }

        .mission-text {
            color: #ffffff;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 10px;
            border-left: 3px solid #ffffff;
            padding-left: 12px;
        }

        .success-text {
            color: #ffffff;
            font-style: italic;
            margin-bottom: 10px;
        }

        .error-text {
            color: #a3a3a3;
        }

        .prompt {
            color: #ffffff;
            font-weight: bold;
            margin-right: 10px;
        }

        .input-line {
            display: flex;
            align-items: center;
        }

        .terminal-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            flex-grow: 1;
        }

        .ls-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin: 5px 0;
        }

        .ls-folder {
            font-weight: bold;
            color: #ffffff;
            text-decoration: underline;
            text-decoration-color: #555;
        }

        .ls-file {
            color: #aaaaaa;
        }

        /* Command Library */
        #library-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            overflow-y: auto;
            padding-bottom: 50px;
        }

        .cmd-card {
            background: #111111;
            border: 1px solid #262626;
            padding: 20px;
            border-radius: 8px;
        }

        .cmd-title {
            color: #ffffff;
            font-family: monospace;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .cmd-desc {
            color: #888888;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>

<body>

    <div id="sidebar">
        <div class="brand">SysAdmin.</div>

        <div id="training-ui">
            <div class="level-tracker" id="ui-level">Level 1 / 20</div>
            <button class="action-btn" id="btn-reset" onclick="resetCurrentLevel()" style="width: 100%;">↻ Restart
                Level</button>
        </div>

        <button id="btn-train" class="menu-btn" onclick="navigate('training')">Training Mode</button>
        <button id="btn-free" class="menu-btn" onclick="navigate('freefall')">Freefall Sandbox</button>
        <div style="border-top: 1px solid #262626; margin: 5px 0;"></div>
        <button id="btn-lib" class="menu-btn" onclick="navigate('library')">Command Library</button>
    </div>

    <div id="main-content">
        <!-- Terminal View -->
        <div id="terminal-page" class="page active">
            <h2 id="terminal-title" style="margin-top:0; color: #fff; font-weight: 500;">Terminal Training</h2>
            <div id="terminal-window" onclick="document.getElementById('cmd-input').focus()">
                <div id="output" class="output-log"></div>
                <div class="input-line">
                    <span class="prompt" id="cmd-prompt">guest@linux:~$</span>
                    <input type="text" id="cmd-input" class="terminal-input" autocomplete="off" autofocus>
                </div>
            </div>
        </div>

        <!-- Library View -->
        <div id="library-page" class="page">
            <h2 style="margin-top:0; color: #fff; font-weight: 500;">Command Reference</h2>
            <p style="color: #888; margin-top:-10px; margin-bottom: 25px;">Standard operating procedures.</p>
            <div id="library-grid"></div>
        </div>
    </div>

    <script>
        // COMMAND DATABASE
        const commandData = [
            { cmd: "ls", desc: "Lists files and folders in your current location." },
            { cmd: "cd", desc: "Changes directory (e.g. 'cd folder_name' to enter, 'cd ..' to go back)." },
            { cmd: "pwd", desc: "Displays the full path of your current directory." },
            { cmd: "mkdir", desc: "Creates a new folder." },
            { cmd: "touch", desc: "Creates a blank new file." },
            { cmd: "rmdir", desc: "Deletes an empty folder." },
            { cmd: "mv", desc: "Renames/moves a file (e.g. mv old.txt new.txt)." },
            { cmd: "cp", desc: "Copies a file." },
            { cmd: "rm", desc: "Deletes a file (Use 'rm -r' for folders)." },
            { cmd: "cat", desc: "Displays a file's contents." },
            { cmd: "clear", desc: "Wipes terminal screen clean." },
            { cmd: "whoami", desc: "Displays your current username." },
            { cmd: "ping", desc: "Tests network connection to a server." },
            { cmd: "history", desc: "Shows previously typed commands." }
        ];

        const grid = document.getElementById('library-grid');
        commandData.forEach(item => {
            grid.innerHTML += `<div class="cmd-card"><div class="cmd-title">${item.cmd}</div><div class="cmd-desc">${item.desc}</div></div>`;
        });

        // FILE SYSTEM
        const masterVfsTemplate = {
            "home": {
                "guest": {
                    "projects": { "attendance_tracker": {} },
                    "sahur.txt": "Tung tung! Wake up bro, time to eat!",
                    "video_ideas.txt": "1. Terminal keyboard shortcuts\n2. Focus on casual audience."
                }
            }
        };

        let vfs = {};
        let currentPath = ["home", "guest"];

        // BUG FIX: Set currentMode to null so the first boot sequence triggers correctly
        let currentMode = null;

        function resetVFS() {
            vfs = JSON.parse(JSON.stringify(masterVfsTemplate));
            currentPath = ["home", "guest"];
        }

        function getVfsDir() {
            let current = vfs;
            for (let folder of currentPath) { current = current[folder]; }
            return current;
        }

        function getPromptString() {
            if (currentPath.length === 0) return `guest@linux:/$`;
            let pathStr = "/" + currentPath.join("/");
            if (pathStr === "/home/guest") pathStr = "~";
            return `guest@linux:${pathStr}$`;
        }

        // MISSIONS
        let currentLevel = 0;
        const levels = [
            { m: "List the files and folders in your current directory. (Hint: Click 'Command Library' on the left to find the command).", c: cmd => cmd === 'ls', s: "System files identified." },
            { m: "Read the contents of the 'sahur.txt' file.", c: cmd => cmd === 'cat sahur.txt', s: "Contents read successfully." },
            { m: "Change your directory to enter the 'projects' folder.", c: cmd => cmd === 'cd projects', s: "Directory changed." },
            { m: "Display the full path of your current working directory to verify your location.", c: cmd => cmd === 'pwd', s: "Path verified: /home/guest/projects." },
            { m: "List the contents of this folder to see what is inside.", c: cmd => cmd === 'ls', s: "Tracker folder found." },
            { m: "Enter the 'attendance_tracker' folder.", c: cmd => cmd === 'cd attendance_tracker', s: "Directory changed." },
            { m: "Create a blank new file named 'db.sqlite'.", c: cmd => cmd === 'touch db.sqlite', s: "Database generated." },
            { m: "List the files again to verify the database was created.", c: cmd => cmd === 'ls', s: "Database is present." },
            { m: "Delete the 'db.sqlite' file.", c: cmd => cmd === 'rm db.sqlite', s: "File removed." },
            { m: "Go back up one folder to return to the projects directory.", c: cmd => cmd === 'cd ..', s: "Returned to projects." },
            { m: "Go back up one more folder to return to your home directory.", c: cmd => cmd === 'cd ..', s: "Returned to home." },
            { m: "Create a new folder named 'roblox_dev'.", c: cmd => cmd === 'mkdir roblox_dev', s: "Directory created." },
            { m: "Enter your newly created 'roblox_dev' folder.", c: cmd => cmd === 'cd roblox_dev', s: "Directory changed." },
            { m: "Create a blank new file named 'main.lua'.", c: cmd => cmd === 'touch main.lua', s: "Script generated." },
            { m: "Run the command that shows your current username.", c: cmd => cmd === 'whoami', s: "User is guest." },
            { m: "Test your network connection by pinging 'google.com'.", c: cmd => cmd === 'ping google.com', s: "Network stable." },
            { m: "Display a list of all the commands you have previously typed.", c: cmd => cmd === 'history', s: "History retrieved." },
            { m: "Return to your home directory by going back up one folder.", c: cmd => cmd === 'cd ..', s: "Returned to home." },
            { m: "Attempt to delete the 'roblox_dev' directory using the command specifically for removing empty directories.", c: cmd => cmd === 'rmdir roblox_dev', s: "Blocked: Directory not empty. Lesson learned." },
            { m: "Wipe the terminal screen clean to finish your training.", c: cmd => cmd === 'clear', s: "Screen cleared." }
        ];

        const outputDiv = document.getElementById('output');
        const promptUI = document.getElementById('cmd-prompt');
        let cmdHistory = [];
        let historyIndex = -1;

        // NAVIGATION LOGIC
        function navigate(target) {
            document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));

            if (target === 'library') {
                document.getElementById('btn-lib').classList.add('active');
                document.getElementById('library-page').classList.add('active');
            } else {
                document.getElementById('terminal-page').classList.add('active');

                if (currentMode !== target) {
                    currentMode = target;
                    resetVFS();
                    outputDiv.innerHTML = '';
                    cmdHistory = [];
                    currentLevel = 0;
                    bootSequence();
                }

                if (target === 'training') {
                    document.getElementById('btn-train').classList.add('active');
                    document.getElementById('terminal-title').innerText = "Terminal Training";
                    document.getElementById('training-ui').style.display = 'block';
                } else {
                    document.getElementById('btn-free').classList.add('active');
                    document.getElementById('terminal-title').innerText = "Sandbox Server";
                    document.getElementById('training-ui').style.display = 'none';
                }
                document.getElementById('cmd-input').focus();
            }
        }

        // RESET CURRENT LEVEL LOGIC
        function resetCurrentLevel() {
            vfs = JSON.parse(JSON.stringify(masterVfsTemplate));
            currentPath = ["home", "guest"];

            if (currentLevel >= 3) currentPath = ["home", "guest", "projects"];
            if (currentLevel >= 6) currentPath = ["home", "guest", "projects", "attendance_tracker"];
            if (currentLevel >= 7 && currentLevel < 9) vfs.home.guest.projects.attendance_tracker["db.sqlite"] = "";
            if (currentLevel >= 10) currentPath = ["home", "guest", "projects"];
            if (currentLevel >= 11) currentPath = ["home", "guest"];
            if (currentLevel >= 12) vfs.home.guest["roblox_dev"] = {};
            if (currentLevel >= 13) currentPath = ["home", "guest", "roblox_dev"];
            if (currentLevel >= 14 && currentLevel < 19) vfs.home.guest["roblox_dev"]["main.lua"] = "";
            if (currentLevel >= 18) currentPath = ["home", "guest"];

            outputDiv.innerHTML = `<div class="system-text">-- Local state rebuilt for Level ${currentLevel + 1} --</div>`;
            printMission();
            promptUI.innerText = getPromptString();
            document.getElementById('cmd-input').focus();
        }

        function printMission() {
            if (currentMode !== 'training') return;
            if (currentLevel < levels.length) {
                document.getElementById('ui-level').innerText = `Level ${currentLevel + 1} / 20`;
                outputDiv.innerHTML += `<div class="mission-text">MISSION: ${levels[currentLevel].m}</div>`;
            } else {
                document.getElementById('ui-level').innerText = `TRAINING COMPLETE`;
                outputDiv.innerHTML += `<div class="mission-text">SYSTEM SECURED. Switch to Freefall Mode to practice freely.</div>`;
            }
        }

        async function bootSequence() {
            promptUI.innerText = getPromptString();
            const bootText = currentMode === 'training'
                ? ["Initializing core modules...", "Loading curriculum...", "Ready."]
                : ["Sandbox environment active.", "No restrictions.", "Ready."];

            for (let i = 0; i < bootText.length; i++) {
                outputDiv.innerHTML += `<div class="system-text" id="line-${i}"></div>`;
                let line = document.getElementById(`line-${i}`);
                for (let char of bootText[i]) {
                    line.innerHTML += char;
                    await new Promise(r => setTimeout(r, 2));
                }
                await new Promise(r => setTimeout(r, 80));
            }
            if (currentMode === 'training') printMission();
        }

        window.onload = () => navigate('training');

        function executeCommand(rawCmd) {
            let parts = rawCmd.split(" ");
            let cmd = parts[0];
            let arg1 = parts[1];
            let arg2 = parts[2];
            let dir = getVfsDir();

            switch (cmd) {
                case 'pwd':
                    return "/" + currentPath.join("/");

                case 'ls':
                    let contents = Object.keys(dir);
                    if (contents.length === 0) return "";
                    let htmlList = contents.map(k => typeof dir[k] === 'object'
                        ? `<div class="ls-folder">${k}/</div>`
                        : `<div class="ls-file">${k}</div>`).join('');
                    return `<div class="ls-grid">${htmlList}</div>`;

                case 'mkdir':
                    if (!arg1) return "mkdir: missing operand";
                    if (dir[arg1]) return `mkdir: cannot create directory '${arg1}': File exists`;
                    dir[arg1] = {};
                    return "";

                case 'touch':
                    if (!arg1) return "touch: missing file operand";
                    if (!dir[arg1]) dir[arg1] = "";
                    return "";

                case 'mv':
                    if (!arg1 || !arg2) return `mv: missing operand`;
                    if (dir[arg1] === undefined) return `mv: cannot stat '${arg1}': No file found`;
                    dir[arg2] = dir[arg1];
                    delete dir[arg1];
                    return "";

                case 'cp':
                    if (!arg1 || !arg2) return `cp: missing operand`;
                    if (dir[arg1] === undefined) return `cp: cannot stat '${arg1}': No file found`;
                    dir[arg2] = JSON.parse(JSON.stringify(dir[arg1]));
                    return "";

                case 'rm':
                    let target = arg1;
                    let recursive = false;
                    if (arg1 === '-r' || arg1 === '-rf') { recursive = true; target = arg2; }
                    if (!target) return `rm: missing operand`;
                    if (dir[target] === undefined) return `rm: cannot remove '${target}': No file found`;
                    if (typeof dir[target] === 'object' && !recursive) return `rm: cannot remove '${target}': Is a directory`;
                    delete dir[target];
                    return "";

                case 'rmdir':
                    if (!arg1) return `rmdir: missing operand`;
                    if (dir[arg1] !== undefined && typeof dir[arg1] === 'object') {
                        if (Object.keys(dir[arg1]).length > 0) return `rmdir: failed '${arg1}': Directory not empty`;
                        delete dir[arg1]; return "";
                    }
                    return `rmdir: failed '${arg1}': No such directory`;

                case 'cd':
                    if (!arg1 || arg1 === '~') { currentPath = ["home", "guest"]; return ""; }
                    if (arg1 === '/') { currentPath = []; return ""; }
                    if (arg1 === '..') { if (currentPath.length > 0) currentPath.pop(); return ""; }
                    if (dir[arg1] && typeof dir[arg1] === 'object') { currentPath.push(arg1); return ""; }
                    return `cd: ${arg1}: No such directory`;

                case 'cat':
                    if (!arg1) return "cat: missing operand";
                    if (dir[arg1] !== undefined && typeof dir[arg1] === 'string') return dir[arg1].replace(/\n/g, "<br>");
                    return `cat: ${arg1}: No such file`;

                case 'clear':
                    outputDiv.innerHTML = ''; return 'CLEAR_SIGNAL';

                case 'whoami': return "guest";
                case 'history': return cmdHistory.map((c, i) => `${i + 1}  ${c}`).join('<br>');
                case 'ping': return `PING ${arg1 || '8.8.8.8'} (56 bytes of data).<br>64 bytes from ${arg1 || '8.8.8.8'}: icmp_seq=1 time=14.2 ms<br>64 bytes from ${arg1 || '8.8.8.8'}: icmp_seq=2 time=12.5 ms`;

                default: return `<span class="error-text">Command not found: ${cmd}</span>`;
            }
        }

        const inputField = document.getElementById('cmd-input');
        inputField.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                const rawCmd = inputField.value.trim().replace(/\s+/g, ' ').toLowerCase();

                if (rawCmd !== '') {
                    cmdHistory.push(rawCmd);
                    historyIndex = cmdHistory.length;

                    outputDiv.innerHTML += `<div><span class="prompt">${getPromptString()}</span> ${rawCmd}</div>`;
                    const response = executeCommand(rawCmd);

                    if (response !== 'CLEAR_SIGNAL' && response !== '') {
                        outputDiv.innerHTML += `<div>${response}</div>`;
                    }
                    promptUI.innerText = getPromptString();

                    // LEVEL CHECKER
                    if (currentMode === 'training' && currentLevel < levels.length) {
                        if (levels[currentLevel].c(rawCmd)) {
                            outputDiv.innerHTML += `<div class="success-text">✓ ${levels[currentLevel].s}</div>`;
                            currentLevel++;

                            inputField.disabled = true;

                            setTimeout(() => {
                                outputDiv.innerHTML = '';
                                printMission();
                                inputField.disabled = false;
                                inputField.focus();
                            }, 1500);
                        }
                    }
                }

                inputField.value = '';
                const terminalWindow = document.getElementById('terminal-window');
                setTimeout(() => terminalWindow.scrollTop = terminalWindow.scrollHeight, 50);
            }

            else if (event.key === 'ArrowUp') {
                event.preventDefault();
                if (historyIndex > 0) { historyIndex--; inputField.value = cmdHistory[historyIndex]; }
            } else if (event.key === 'ArrowDown') {
                event.preventDefault();
                if (historyIndex < cmdHistory.length - 1) { historyIndex++; inputField.value = cmdHistory[historyIndex]; }
                else { historyIndex = cmdHistory.length; inputField.value = ''; }
            }
        });

        document.addEventListener('keydown', function (event) {
            if (event.ctrlKey && event.key === 'l') {
                event.preventDefault();
                outputDiv.innerHTML = `<div class="system-text">Screen cleared.</div>`;

                if (currentMode === 'training' && currentLevel < levels.length && levels[currentLevel].c('clear')) {
                    outputDiv.innerHTML += `<div class="success-text">✓ ${levels[currentLevel].s}</div>`;
                    currentLevel++;

                    inputField.disabled = true;
                    setTimeout(() => {
                        outputDiv.innerHTML = '';
                        printMission();
                        inputField.disabled = false;
                        inputField.focus();
                    }, 1500);
                }
            }
        });
    </script>
</body>

</html>
